<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZemenByte Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#060a14; --panel:#0c1220; --border:#1a2540;
    --accent:#00e5ff; --accent2:#7c3aed; --accent3:#10b981;
    --warn:#f59e0b; --danger:#ef4444; --text:#e2e8f0; --muted:#64748b;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;
    min-height:100vh;padding:16px;
    background-image:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.08) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 100%,rgba(0,229,255,.06) 0%,transparent 60%)}

  /* ── Header ── */
  .header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{width:42px;height:42px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .header-text h1{font-size:18px;font-weight:800}
  .header-text p{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
  .live-badge{margin-left:auto;background:rgba(16,185,129,.15);border:1px solid var(--accent3);
    color:var(--accent3);padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;
    display:flex;align-items:center;gap:5px;font-family:'Space Mono',monospace}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── Stats ── */
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
    font-family:'Space Mono',monospace;margin-bottom:5px}
  .stat-value{font-size:24px;font-weight:800;line-height:1}
  .stat-sub{font-size:10px;color:var(--accent3);margin-top:3px;font-family:'Space Mono',monospace}

  /* ── Cards ── */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:12px}
  .card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;
    font-family:'Space Mono',monospace}
  .card-title .accent{color:var(--accent)}

  /* ── Buttons ── */
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 10px;cursor:pointer;font-family:'Syne',sans-serif;
    font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;
    transition:all .2s;width:100%;justify-content:center}
  .btn:hover{border-color:var(--accent);background:rgba(0,229,255,.05)}
  .btn:active{transform:scale(.97)}
  .btn.loading{opacity:.6;pointer-events:none}
  .btn-icon{font-size:15px}
  .btn-post-now{grid-column:1/-1;background:rgba(0,229,255,.08);
    border-color:var(--accent);color:var(--accent);font-size:13px;padding:14px}

  /* ── Topic select ── */
  .topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .topic-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:8px 4px;cursor:pointer;font-size:11px;font-weight:600;
    font-family:'Syne',sans-serif;transition:all .2s}
  .topic-btn:hover,.topic-btn.selected{border-color:var(--accent);color:var(--accent);
    background:rgba(0,229,255,.06)}

  /* ── Schedule ── */
  .timeline{display:flex;flex-direction:column;gap:6px}
  .tl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--border)}
  .tl-item.active{border-color:var(--accent);background:rgba(0,229,255,.04)}
  .tl-item.done{opacity:.4}
  .tl-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);min-width:44px}
  .tl-item.active .tl-time{color:var(--accent)}
  .tl-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
  .tl-item.active .tl-dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .tl-item.done .tl-dot{background:var(--accent3)}
  .tl-label{font-size:12px;font-weight:600;flex:1}
  .tl-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-family:'Space Mono',monospace}

  /* ── Topic bars ── */
  .topic-list{display:flex;flex-direction:column;gap:8px}
  .t-row{}
  .t-header{display:flex;justify-content:space-between;margin-bottom:3px}
  .t-name{font-size:12px;font-weight:600}
  .t-count{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace}
  .bar-track{height:4px;background:var(--border);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width 1.2s ease}

  /* ── Toast ── */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#0c1220;border:1px solid var(--accent3);color:var(--accent3);
    padding:10px 20px;border-radius:10px;font-size:12px;font-family:'Space Mono',monospace;
    transition:transform .3s;z-index:999;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.error{border-color:var(--danger);color:var(--danger)}

  /* ── Scheduler toggle ── */
  .sched-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .sched-status{font-size:12px;font-family:'Space Mono',monospace;flex:1}
  .toggle-btn{background:transparent;border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px 14px;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;
    font-weight:700;transition:all .2s}
  .toggle-btn.running{border-color:var(--accent3);color:var(--accent3)}
  .toggle-btn.paused{border-color:var(--warn);color:var(--warn)}

  /* ── Preview ── */
  .preview-box{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.12);
    border-radius:8px;padding:12px;font-family:'Space Mono',monospace;font-size:10px;
    line-height:1.7;max-height:160px;overflow-y:auto;white-space:pre-wrap;color:var(--text)}
  .preview-box::-webkit-scrollbar{width:3px}
  .preview-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

  /* ── Spinner ── */
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .loading-state{text-align:center;padding:20px;color:var(--muted);
    font-family:'Space Mono',monospace;font-size:12px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">⚡</div>
  <div class="header-text">
    <h1>ZemenByte</h1>
    <p id="channelLabel">@ZemenByte • Loading...</p>
  </div>
  <div class="live-badge"><div class="dot"></div>LIVE</div>
</div>

<!-- Stats -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">Members</div>
    <div class="stat-value" id="statMembers"><div class="spinner"></div></div>
    <div class="stat-sub" id="statMembersSub">fetching live...</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Posts Today</div>
    <div class="stat-value" id="statPosts"><div class="spinner"></div></div>
    <div class="stat-sub" id="statPostsSub">loading...</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Posts</div>
    <div class="stat-value" id="statTotal"><div class="spinner"></div></div>
    <div class="stat-sub" id="statTotalSub">all time</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Scheduler</div>
    <div class="stat-value" id="statSched" style="font-size:16px;padding-top:4px">...</div>
    <div class="stat-sub" id="statNext">next post: —</div>
  </div>
</div>

<!-- Post Now -->
<div class="card">
  <div class="card-title"><span class="accent">📝</span> Post to Channel</div>
  <div class="btn-grid">
    <button class="btn btn-post-now" onclick="postAuto()">
      <span class="btn-icon">🚀</span> Post Now (Auto Topic)
    </button>
  </div>
  <div class="topic-grid" id="topicBtns"></div>
</div>

<!-- Growth Tools -->
<div class="card">
  <div class="card-title"><span class="accent">🌱</span> Growth Tools</div>
  <div class="btn-grid">
    <button class="btn" onclick="growthAction('poll')"><span class="btn-icon">📣</span> Publish Poll</button>
    <button class="btn" onclick="growthAction('engage')"><span class="btn-icon">💬</span> Engage Post</button>
    <button class="btn" onclick="growthAction('notify')"><span class="btn-icon">🔔</span> Push Notify</button>
    <button class="btn" onclick="refreshMembers()"><span class="btn-icon">🔄</span> Sync Members</button>
  </div>
</div>

<!-- Scheduler -->
<div class="card">
  <div class="card-title"><span class="accent">⏰</span> Schedule</div>
  <div class="sched-row">
    <div class="sched-status" id="schedStatus">Loading...</div>
    <button class="toggle-btn" id="schedToggle" onclick="toggleScheduler()">...</button>
  </div>
  <div class="timeline" id="timeline"></div>
</div>

<!-- Topic Distribution -->
<div class="card">
  <div class="card-title"><span class="accent">📊</span> Topic Distribution</div>
  <div class="topic-list" id="topicDist"></div>
</div>

<!-- Next Post Preview -->
<div class="card">
  <div class="card-title">
    <span class="accent">👁</span> Next Post Preview
    <button onclick="loadPreview()" style="margin-left:auto;background:rgba(0,229,255,.1);
      border:1px solid var(--accent);color:var(--accent);padding:3px 10px;border-radius:6px;
      cursor:pointer;font-size:10px;font-family:'Space Mono',monospace">↻ NEW</button>
  </div>
  <div class="preview-box" id="previewBox">Loading preview...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// IMPORTANT: Replace with your actual Railway API URL after deployment
// It looks like: https://your-app-name.up.railway.app
const API_BASE = (window.location.hostname === 'abdu-31.github.io' || window.location.hostname.includes('github.io'))
  ? (localStorage.getItem('zb_api_url') || promptForAPI())
  : window.location.origin;

const SECRET = localStorage.getItem('zb_secret') || 'zemenbyte2025';

function promptForAPI() {
  const url = prompt(
    '🔧 First time setup!\n\nEnter your Railway API URL:\n(e.g. https://your-app.up.railway.app)',
    'https://your-app.up.railway.app'
  );
  if (url) localStorage.setItem('zb_api_url', url.replace(/\/$/, ''));
  return url || '';
}

const topicColors = {
  AI:'#00e5ff', Crypto:'#f59e0b', Cybersecurity:'#ef4444',
  Quantum:'#7c3aed', Innovation:'#ec4899', Tech:'#10b981'
};

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ── API calls ─────────────────────────────────────────────────────────────
async function api(path, method='GET', body=null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': SECRET }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  return res.json();
}

// ── Load stats ────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const d = await api('/api/stats');
    document.getElementById('statMembers').textContent = d.members.toLocaleString();
    document.getElementById('statMembersSub').textContent = 'live from Telegram';
    document.getElementById('statPosts').textContent = d.posts_today;
    document.getElementById('statPostsSub').textContent = `${d.remaining} remaining today`;
    document.getElementById('statTotal').textContent = d.total_posts;
    document.getElementById('statTotalSub').textContent = 'all time';
    document.getElementById('channelLabel').textContent = `@${d.channel} • Telegram Channel`;

    const running = d.scheduler_running;
    document.getElementById('statSched').textContent = running ? '🟢 Running' : '🟡 Paused';
    document.getElementById('statNext').textContent = `next: ${d.next_post}`;

    const toggle = document.getElementById('schedToggle');
    toggle.textContent = running ? '⏸ Pause' : '▶️ Resume';
    toggle.className = 'toggle-btn ' + (running ? 'running' : 'paused');
    document.getElementById('schedStatus').textContent =
      `${d.posts_per_day} posts/day • Next: ${d.next_post}`;

    renderTopicDist(d.topics);
    renderTimeline(d.post_hours || [7,10,13,16,19,22]);
  } catch(e) {
    toast('⚠️ Cannot reach API — check Railway URL', true);
    renderTimeline([7,10,13,16,19,22]);
  }
}

// ── Timeline ─────────────────────────────────────────────────────────────
const topicNames = ['AI','Crypto','Cybersecurity','Quantum','Tech','Innovation'];
function renderTimeline(hours) {
  const now = new Date();
  const nowH = now.getUTCHours() + now.getUTCMinutes()/60;
  const el = document.getElementById('timeline');
  el.innerHTML = hours.map((h, i) => {
    const status = h < nowH ? 'done' : h <= nowH+0.2 ? 'active' : 'pending';
    const topic  = topicNames[i % topicNames.length];
    const color  = topicColors[topic] || '#fff';
    return `<div class="tl-item ${status}">
      <div class="tl-time">${String(h).padStart(2,'0')}:00</div>
      <div class="tl-dot"></div>
      <div class="tl-label">${['Morning Brief','Mid-Morning','Afternoon Drop','Deep Dive','Evening Update','Night Wrap'][i]||'Post'}</div>
      <div class="tl-tag" style="background:${color}20;color:${color};border:1px solid ${color}40">#${topic}</div>
    </div>`;
  }).join('');
}

// ── Topic distribution ────────────────────────────────────────────────────
function renderTopicDist(topics) {
  if (!topics || !topics.length) {
    document.getElementById('topicDist').innerHTML =
      '<div style="color:var(--muted);font-size:12px">No posts yet</div>';
    return;
  }
  const max = topics[0][1] || 1;
  document.getElementById('topicDist').innerHTML = topics.map(([t, c]) => {
    const color = topicColors[t] || '#888';
    const pct   = Math.round((c/max)*100);
    return `<div class="t-row">
      <div class="t-header">
        <div class="t-name">${t}</div>
        <div class="t-count">${c} posts</div>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
    </div>`;
  }).join('');
}

// ── Topic buttons ─────────────────────────────────────────────────────────
function renderTopicBtns() {
  document.getElementById('topicBtns').innerHTML =
    topicNames.map(t => `
      <button class="topic-btn" onclick="postTopic('${t}')">#${t}</button>
    `).join('');
}

// ── Post actions ──────────────────────────────────────────────────────────
async function postAuto() {
  const btn = event.target.closest('.btn');
  btn.classList.add('loading');
  btn.innerHTML = '<div class="spinner"></div> Posting...';
  try {
    const d = await api('/api/post', 'POST', {});
    if (d.ok) {
      toast(`✅ Posted! Topic: #${d.topic}`);
      loadStats();
    } else {
      toast('❌ Post failed: ' + d.error, true);
    }
  } catch(e) { toast('❌ Connection error', true); }
  btn.classList.remove('loading');
  btn.innerHTML = '<span class="btn-icon">🚀</span> Post Now (Auto Topic)';
}

async function postTopic(topic) {
  const btns = document.querySelectorAll('.topic-btn');
  btns.forEach(b => { if(b.textContent === '#'+topic) b.classList.add('selected'); });
  toast(`⏳ Posting #${topic}...`);
  try {
    const d = await api('/api/post', 'POST', { topic });
    if (d.ok) {
      toast(`✅ #${topic} posted!`);
      loadStats();
    } else {
      toast('❌ ' + d.error, true);
    }
  } catch(e) { toast('❌ Connection error', true); }
  btns.forEach(b => b.classList.remove('selected'));
}

// ── Growth ────────────────────────────────────────────────────────────────
async function growthAction(type) {
  const labels = { poll:'📣 Publishing poll...', engage:'💬 Posting engagement...', notify:'🔔 Sending notification...' };
  toast(labels[type] || '⏳ Working...');
  try {
    const d = await api('/api/' + type, 'POST', {});
    if (d.ok) toast(`✅ Done!`);
    else toast('❌ ' + d.error, true);
  } catch(e) { toast('❌ Connection error', true); }
}

async function refreshMembers() {
  toast('🔄 Syncing member count...');
  try {
    const d = await api('/api/refresh_members', 'POST', {});
    if (d.ok) {
      document.getElementById('statMembers').textContent = d.members.toLocaleString();
      toast(`✅ Members updated: ${d.members.toLocaleString()}`);
    }
  } catch(e) { toast('❌ Connection error', true); }
}

// ── Scheduler toggle ──────────────────────────────────────────────────────
async function toggleScheduler() {
  const btn = document.getElementById('schedToggle');
  const isRunning = btn.classList.contains('running');
  const path = isRunning ? '/api/scheduler/pause' : '/api/scheduler/resume';
  try {
    const d = await api(path, 'POST', {});
    toast(d.running ? '▶️ Scheduler resumed' : '⏸ Scheduler paused');
    loadStats();
  } catch(e) { toast('❌ Connection error', true); }
}

// ── Preview ───────────────────────────────────────────────────────────────
async function loadPreview() {
  document.getElementById('previewBox').textContent = 'Loading...';
  try {
    const d = await api('/api/preview');
    document.getElementById('previewBox').textContent = d.text || 'No preview available';
  } catch(e) {
    document.getElementById('previewBox').textContent = 'Could not load preview';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
renderTopicBtns();
loadStats();
loadPreview();
setInterval(loadStats, 60000); // refresh every minute
</script>
</body>
</html>
